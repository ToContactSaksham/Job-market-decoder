[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-decoder"
version = "0.1.0"
description = "Scrape data-role job postings, extract skills, analyze pay and demand, recommend what to learn next."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0", "pandas>=2.2", "numpy>=1.26",
  "scipy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jmd = "jmd.cli:main"

[tool.setuptools.packages.find]
include = ["jmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
